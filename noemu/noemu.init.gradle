// noemu: adds a Robolectric driver to one app module for this build only. Nothing in the project changes.
def target = System.getProperty("noemu.module", ":app")
def driver = System.getProperty("noemu.driver")
def configure = { Project p ->
    if (p.path != target) return
    p.plugins.withId("com.android.application") {
        p.android.testOptions.unitTests.includeAndroidResources = true
        println("noemu: adding $driver/driver to ${p.path} test sources")
        p.android.sourceSets.test.java.srcDir("$driver/driver")
        p.android.sourceSets.test.kotlin.srcDir("$driver/driver")
        p.android.sourceSets.test.resources.srcDir("$driver/driver/resources")  // Robolectric plugins (DistinctUptime)
        p.dependencies {
            testImplementation "org.robolectric:robolectric:4.16"
            testImplementation "androidx.test:core-ktx:1.6.1"
            testImplementation "androidx.test.ext:junit:1.2.1"
            testImplementation "junit:junit:4.13.2"
            testImplementation "com.squareup.leakcanary:shark-android:2.14"  // LeakCanary's heap analysis, for leak paths
            // Projects on the JUnit Platform (useJUnitPlatform(), common with kotlin.test in KMP) only find the
            // JUnit 4 driver through the vintage engine; on plain JUnit 4 it is unused.
            testRuntimeOnly "org.junit.vintage:junit-vintage-engine:5.11.4"
            // NOEMU_DEPS: JVM builds of native libraries the app loads, e.g. com.wire:core-crypto-jvm (Android's
            // .so files can't load on the JVM; a JVM artifact with the same classes brings host libraries).
            System.getProperty("noemu.deps", "").split(",").findAll { it.trim() }.each { testRuntimeOnly it.trim() }
        }
        p.tasks.withType(Test).configureEach { t ->
            t.outputs.upToDateWhen { false }
            t.maxHeapSize = "3g"
            t.testLogging.showStandardStreams = true
            ["noemu.port", "noemu.out", "noemu.activity", "noemu.data", "noemu.settle", "noemu.shots"].each { k -> if (System.getProperty(k)) t.systemProperty(k, System.getProperty(k)) }
            t.jvmArgs("--add-opens=java.base/jdk.internal.access=ALL-UNNAMED")
            // The app JVM's command, so more instances can start from the same build without Gradle (noemu fleet).
            t.doFirst {
                def out = System.getProperty("noemu.out")
                if (out) new File(out, "launch.json").text = groovy.json.JsonOutput.toJson([
                        java: t.javaLauncher.get().executablePath.asFile.path, jvmArgs: t.allJvmArgs,
                        classpath: t.classpath.asPath, workingDir: t.workingDir.path])
                // `noemu build`: compile and record, but don't start the app here.
                if (System.getProperty("noemu.recordOnly")) throw new StopExecutionException()
            }
            // Robolectric runs SDK 36 only on Java 21+; on an older test JVM, take an installed JDK 21 (Gradle finds them).
            def declared = p.extensions.findByType(JavaPluginExtension)?.toolchain?.languageVersion?.getOrNull()
            def version = declared ? declared.asInt() : (JavaVersion.current().majorVersion as int)
            if (version < 21) {
                t.javaLauncher.set(p.extensions.getByType(JavaToolchainService).launcherFor { it.languageVersion.set(JavaLanguageVersion.of(21)) })
            }
        }
    }
}
// Projects with isolated projects on (org.gradle.isolated-projects) forbid allprojects; lifecycle hooks (Gradle 8.8+)
// work either way.
if (gradle.metaClass.respondsTo(gradle, "getLifecycle")) gradle.lifecycle.beforeProject(configure) else gradle.allprojects(configure)
